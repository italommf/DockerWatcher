version: '3.8'

services:
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: docker-watcher-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus-local.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - docker-watcher-network
    # Para Windows/Mac com Docker Desktop, usar host.docker.internal para acessar o host
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  prometheus_data:

networks:
  docker-watcher-network:
    driver: bridge
    external: true
