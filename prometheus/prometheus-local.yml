# Configuração do Prometheus para desenvolvimento local
# Este arquivo é usado quando rodando Prometheus via docker-compose para desenvolvimento

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Para Kubernetes - quando prometheus estiver dentro do cluster
  # Descomente se precisar coletar métricas do Kubernetes
