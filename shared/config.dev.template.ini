# =============================================================================
# DockerWatcher - Configuração de DESENVOLVIMENTO (Template)
# =============================================================================
# Copie este arquivo para shared/config.dev.ini e ajuste os valores
# O arquivo config.dev.ini está no .gitignore para segurança
# =============================================================================

[SSH]
host = 192.168.1.34
port = 22
username = bwa
use_key = false
key_path =
password = SUA_SENHA_AQUI

[MySQL]
host = 192.168.1.36
port = 3306
user = rpa
password = SUA_SENHA_AQUI
database = bwav4

[PATHS]
rpa_config_path = /caminho/absoluto/rpa_config
cronjobs_path = /caminho/absoluto/cronjobs
deployments_path = /caminho/absoluto/deployments

[API]
port = 8001
host = 127.0.0.1

[BACKEND]
bind_host = 0.0.0.0
bind_port = 8001
polling_interval_vm = 10
polling_interval_db = 10

[KUBERNETES]
in_cluster = false
kubeconfig_path = /home/bwa/.kube/config
namespace = default

[PROMETHEUS]
url = http://192.168.1.34:30090

[EXECUTIONS_API]
base_url = http://localhost:3000
listar_execucoes_abertas_endpoint = /api/execucoes/abertas
timeout = 30
